[package]
name = "printforge"
version = "0.1.1"
description = "OneDrop PrintForge : firmware, fichiers et musique pour la Prusa CORE One"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
ureq = "3"
mdns-sd = "0.22"
sha2 = "0.10"
# sans « parallel » : il tirerait rayon pour des fichiers de quelques kilo-octets
midly = { version = "0.5", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.38", default-features = false, features = ["disk"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
